# Blank entries are interpreted as "None"
###

# Random seed to ensure reproducible results.
random_seed: 454

# Spectrum processing options.
n_peaks: 600
sub_peaks: 50
min_mz: 50.0
max_mz: 2500.0
min_intensity: 0.01
remove_precursor_tol: 2.0  # Da
max_charge: 5
precursor_mass_tol: 50  # ppm
isotope_error_range: [0, 1]
prec_length: 5

# Model architecture options.
dim_model: 512
n_head: 8
dim_feedforward: 1024
n_layers: 9
dropout: 0.0
dim_intensity:
max_length: 100

# Dataset
start: 0
end: 11
# Path to generated training MGF shards (not included).
mgf_file: 'data/train_data/'
# Path to spectrum–peptide mappings generated by s1_psm_match.py (not included).
psm_path: 'data/psm_info/'
# Path to cached lookup/index tables generated by s3_train_data_offset.py (not included).
lookup_file: 'data/train_data_offset/'
valid_species: 'Hh_24h_500_04'
spec_step: 1000
sample_num: 4
spec_num: 500000

# Training/inference options.
train_batch_size: 32
val_batch_size: 32
n_workers: None
lr: 0.0005
weight_decay: 0.00001
warmup_iters: 100000 # 64 50000
max_iters: 600000 
start_epoch: 0
max_epochs: 10
train_mask_ratio: 0.0
train_signal: False
scheduler: True

# model
title: '1bs64_lr5e4_600_9layers_10epochs_2sample'
modelname: False 
old_schedular: False

# save checkpoint
cpt_path: 'checkpoints'

