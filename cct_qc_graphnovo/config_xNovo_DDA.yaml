###
# xNovo_DDA configuration.
# Blank entries are interpreted as "None"
###

# Random seed to ensure reproducible results.
random_seed: 454

# Spectrum processing options.
n_peaks: 150
min_mz: 50.0
max_mz: 2500.0
min_intensity: 0.01
remove_precursor_tol: 2.0  # Da
max_charge: 10
precursor_mass_tol: 50  # ppm
isotope_error_range: [0, 1]

# Model architecture options.
dim_model: 512
n_head: 8
dim_feedforward: 1024
n_layers: 9
dropout: 0.1
dim_intensity:
max_length: 100

# Dataset
# Path to the GraphNovo MGF root directory (not included in this repo).
# Example: data/graphnovo_mgf/
mgf_file: 'data/graphnovo_mgf/'
valid_species: 'A_Thaliana'
spec_step: 1000
sample_type: False
dst_len: 1600000

# Training/inference options.
train_batch_size: 128
val_batch_size: 128
n_workers: None
lr: 0.0005
weight_decay: 0.00001
warmup_iters: 100000 # 64 50000
max_iters: 600000 
start_epoch: 0
max_epochs: 2
train_mask_ratio: 0.5
train_signal: True
scheduler: True

# model
use_by_mask: True
title: 'bs128_lr5e4'
modelname: False 
old_schedular: False

# save checkpoint
cpt_path: 'checkpoints'

